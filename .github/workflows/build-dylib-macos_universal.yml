name: Build .dylib files (universal) for macOS

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Build propakai_cpp.dylib
      run: |
        export MACOSX_DEPLOYMENT_TARGET=10.15
        cd cpp/propakai_cpp
        make

    - name: Build p528_5.dylib
      run: |
        export MACOSX_DEPLOYMENT_TARGET=10.15
        cd cpp/ntia_p528_5
        make

    - name: Build p368_10.dylib
      run: |
        export MACOSX_DEPLOYMENT_TARGET=10.15
        cd cpp/ntia_p368_10
        make

    - name: Check deployment targets
      run: |
        otool -l cpp/propakai_cpp/build/release/propakai_cpp.dylib | grep -E -A 4 "LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION"
        otool -l cpp/ntia_p528_5/build/release/p528_5.dylib | grep -E -A 4 "LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION"
        otool -l cpp/ntia_p368_10/build/release/p368_10.dylib | grep -E -A 4 "LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION"
        lipo -info cpp/propakai_cpp/build/release/propakai_cpp.dylib
        lipo -info cpp/ntia_p528_5/build/release/p528_5.dylib
        lipo -info cpp/ntia_p368_10/build/release/p368_10.dylib

    - name: Install python dependencies for tests
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-tests.txt

    - name: Run all DSO tests
      run: python -m unittest discover -s tests/tests -p "test_*_dso.py" -v

    - name: Upload .dylib files as artifact
      uses: actions/upload-artifact@v6
      with:
        name: macos-dylibs-universal
        path: |
          propakai/bin/macos/universal/propakai_cpp.dylib
          propakai/bin/macos/universal/p528_5.dylib
          propakai/bin/macos/universal/p368_10.dylib
