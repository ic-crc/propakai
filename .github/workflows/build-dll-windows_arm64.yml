name: Build .dll files for Windows ARM64

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            make

      - name: Build propakai_cpp.dll
        shell: msys2 {0}
        run: |
          cd cpp/propakai_cpp
          make CXX=clang++

      - name: Build p528_5.dll
        shell: msys2 {0}
        run: |
          cd cpp/ntia_p528_5
          make CXX=clang++

      - name: Build p368_10.dll
        shell: msys2 {0}
        run: |
          cd cpp/ntia_p368_10
          make CXX=clang++

      - name: Install python dependencies for tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tests.txt

      - name: Run all DSO tests
        run: python -m unittest discover -s tests/tests -p "test_*_dso.py" -v

      - name: Upload .dll files as artifact
        uses: actions/upload-artifact@v6
        with:
          name: win-dll-arm64
          path: |
            propakai/bin/win/arm64/propakai_cpp.dll
            propakai/bin/win/arm64/p528_5.dll
            propakai/bin/win/arm64/p368_10.dll
