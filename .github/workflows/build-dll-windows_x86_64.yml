name: Build .dll files for Windows x86_64

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make

      - name: Build propakai_cpp.dll
        shell: msys2 {0}
        run: |
          cd cpp/propakai_cpp
          mingw32-make

      - name: Build p528_5.dll
        shell: msys2 {0}
        run: |
          cd cpp/ntia_p528_5
          mingw32-make

      - name: Build p368_10.dll
        shell: msys2 {0}
        run: |
          cd cpp/ntia_p368_10
          mingw32-make

      - name: Install python dependencies for tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tests.txt

      - name: Run all DSO tests
        run: python -m unittest discover -s tests/tests -p "test_*_dso.py" -v

      - name: Upload .dll files as artifact
        uses: actions/upload-artifact@v6
        with:
          name: win-dll-x86_64
          path: |
            propakai/bin/win/x86_64/propakai_cpp.dll
            propakai/bin/win/x86_64/p528_5.dll
            propakai/bin/win/x86_64/p368_10.dll
